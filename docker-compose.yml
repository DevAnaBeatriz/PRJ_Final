version: '3.8'
services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_DB: modulo2db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      SPRING_PROFILES_ACTIVE: docker
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/modulo2db
      SPRING_DATASOURCE_USERNAME: postgres
      SPRING_DATASOURCE_PASSWORD: postgres
      JWT_SECRET: 12345678901234567890123456789012345678901234567890123456789012
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - modulo2-net
  login-app:
    build: ./login-app
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/modulo2db
      - SPRING_DATASOURCE_USERNAME=postgres
      - SPRING_DATASOURCE_PASSWORD=postgres
      - JWT_SECRET=12345678901234567890123456789012345678901234567890123456789012
    depends_on:
      - postgres
    networks:
      - modulo2-net
    # intentionally do NOT publish ports for login-app

  api-gateway:
    build: ./api-gateway
    environment:
      - JWT_SECRET=12345678901234567890123456789012345678901234567890123456789012
    ports:
      - "8080:8080"
    depends_on:
      - login-app
    networks:
      - modulo2-net

volumes:
  pgdata:

networks:
  modulo2-net:
    driver: bridge
